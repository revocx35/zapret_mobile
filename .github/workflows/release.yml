name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Gate the whole job on the signing secrets: without them the release build
      # would be unsigned (uninstallable), so the job is a green no-op instead.
      # Add RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS /
      # RELEASE_KEY_PASSWORD in repo settings to enable tag-triggered releases.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check signing secrets
        id: gate
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets configured; skipping release build."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          go-version: '1.24'

      - name: Install Android NDK
        id: ndk
        if: steps.gate.outputs.enabled == 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install gomobile
        if: steps.gate.outputs.enabled == 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build engine .aar
        if: steps.gate.outputs.enabled == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: scripts/build-engine.sh

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Decode signing keystore
        if: steps.gate.outputs.enabled == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Assemble release
        if: steps.gate.outputs.enabled == 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Create GitHub release
        if: steps.gate.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release*.apk
          generate_release_notes: true
